version: "3.8"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: $DB_URL
      DB_USER: $DB_USER
      DB_PASS: $DB_PASS
      OPENAI_API_KEY: $OPENAI_API_KEY
      GEMINI_API_KEY: $GEMINI_API_KEY
      S3_ALURA_CHALANGE: $S3_ALURA_CHALANGE
      AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
      AWS_REGION: us-east-2
